version: '3.8'
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  signaling1:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379
      - SIGNALING_PORT=8080
      - SIGNALING_NODE_ID=signaling-1
    depends_on:
      - redis
    ports:
      - "8081:8080"

  signaling2:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379
      - SIGNALING_PORT=8080
      - SIGNALING_NODE_ID=signaling-2
    depends_on:
      - redis
    ports:
      - "8082:8080"

  mediasoup:
    image: "mediasoup/mediasoup"
    # Placeholder service. Run a real mediasoup instance separately for production.
    # Configure ports, volumes and environment for a real SFU deployment.
    restart: "no"
